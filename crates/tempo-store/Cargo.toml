[package]
name = "tempo-store"
description = "Persistência (SQLite) e serviço de aplicação do app de gestão de tempo."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tempo-core.workspace = true
chrono.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }

[features]
# Cópia do banco em memória para bytes e de volta (versão web: persistência no IndexedDB).
snapshot = ["rusqlite/serialize"]

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }

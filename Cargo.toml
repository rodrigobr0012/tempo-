[workspace]
resolver = "2"
members = ["crates/tempo-core", "crates/tempo-store", "crates/tempo-app", "crates/tempo-web", "crates/tempo-pc"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
tempo-core = { path = "crates/tempo-core" }
tempo-store = { path = "crates/tempo-store" }
chrono = { version = "0.4.38", default-features = false, features = ["std", "clock"] }
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
